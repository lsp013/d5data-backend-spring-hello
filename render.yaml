# Render Blueprint —— 一键部署这个 Spring Boot 服务
# 用法：Render 控制台 → New → Blueprint → 选择本仓库（渲染完成后会给出公网 URL）
services:
  - type: web
    name: d5data-spring-hello
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JWT_SECRET
        generateValue: true      # 由 Render 生成随机密钥，覆盖仓库里的演示值
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx256m
